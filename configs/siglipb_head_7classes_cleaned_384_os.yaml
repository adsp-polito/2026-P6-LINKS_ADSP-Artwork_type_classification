seed_everything: 42
run_name: siglipb_head_7classes_cleaned_384_os
out_dir: runs
wandb_project: artwork-type-classification
wandb_entity: ADSP-project

trainer:
  max_epochs: 20
  accelerator: gpu
  devices: 1
  precision: 16-mixed

model:
  model_name: vit_base_patch16_siglip_384.webli
  pretrained: true
  freeze_backbone: true  # head only
  lr_head: 1.0e-3
data:
  splits: data/split7_cleaned.csv
  data_root: /kaggle/input/datasets/fabiostradiotti/artkb-dataset
  img_size: 384
  batch_size: 64
  cache_features: true
  features_dir: features/siglipb_head_7classes_cleaned_384_os
  augmentation: false
  oversampling: true
