seed_everything: 42
run_name: swinv2b_head_7classes_cleaned_256_lr3e-4_wd0.1
out_dir: runs
wandb_project: artwork-type-classification
wandb_entity: ADSP-project

trainer:
  max_epochs: 10
  accelerator: gpu
  devices: 1
  precision: 16-mixed

model:
  model_name: swinv2_base_window12to16_192to256.ms_in22k_ft_in1k
  pretrained: true
  freeze_backbone: true  # head only
  lr_head: 3.0e-4
  weight_decay: 0.1  # vs lr3e-4_wd0.05: isolates the effect of weight decay
  label_smoothing: 0.1
  warmup_epochs: 0.5
  cosine_decay: true
data:
  splits: data/split7_cleaned.csv
  data_root: /kaggle/input/datasets/fabiostradiotti/artkb-dataset
  img_size: 256
  batch_size: 64
  cache_features: true  # backbone features extracted once, then only the head is trained
  features_dir: features/swinv2b_head_7classes_cleaned_256  # shared cache, same model and img_size
